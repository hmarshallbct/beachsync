# beachsync status dashboard, LAN/tailnet only.
#
# beachsync.bctuk.com resolves to the box's LAN address (10.3.1.46) via deSEC,
# exactly like beachstats.bctuk.com, and uses the same *.bctuk.com wildcard
# certificate. It is NOT reachable from the internet (the public name
# beachsync.beachcomberapi.uk exposes only /webhooks and /health).
# Install: cp to /home/bctadmin/edgerunner/deploy/nginx/conf.d/beachsync-lan.conf
server {
    listen 80;
    server_name beachsync.bctuk.com;
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    http2 on;
    server_name beachsync.bctuk.com;
    ssl_certificate     /etc/nginx/certs/beachstats.fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/beachstats.key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    resolver 127.0.0.11 ipv6=off valid=30s;
    set $beachsync_upstream beachsync:8080;

    location = / { return 302 /status; }
    location ~ ^/(status(\.json)?|health|static/.*)$ {
        proxy_pass http://$beachsync_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location / { return 404; }
}
