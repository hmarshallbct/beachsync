# beachsync (TigerBay -> HubSpot webhook receiver) behind the edge proxy.
#
# Install: copy to /home/bctadmin/edgerunner/deploy/nginx/conf.d/beachsync.conf
# then `docker exec edge-nginx nginx -t && docker exec edge-nginx nginx -s reload`.
# Upstream is reached over the shared external `edge` network (the beachsync
# compose project attaches to it), same pattern as beachstats.conf.
#
# Certificate: Let's Encrypt HTTP-01 via the acme webroot, exactly like
# netbird.beachcombertours.uk — see deploy/issue-cert.sh. Needs a public DNS A
# record beachsync.beachcombertours.uk -> this box's public IP first.

server {
    listen 80;
    server_name beachsync.beachcomberapi.uk beachsync.beachcombertours.uk;
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name beachsync.beachcomberapi.uk beachsync.beachcombertours.uk;

    ssl_certificate     /etc/nginx/certs/beachsync.fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/beachsync.key.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Resolve per request so the proxy still starts while beachsync is down.
    resolver 127.0.0.11 ipv6=off valid=30s;
    resolver_timeout 5s;
    set $beachsync_upstream beachsync:8080;

    client_max_body_size 2m;

    # Only the webhook receiver and the health probe are reachable from the
    # internet. The admin API stays LAN/tailnet-only (docker exec / curl on the box).
    location ~ ^/(webhooks/|health$) {
        proxy_pass http://$beachsync_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    location / {
        return 404;
    }
}
